name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (architecture zones)
        run: npm run lint
      - name: i18n keys
        run: npm run i18n:check
      - name: Unit tests
        run: npm test -- --maxWorkers=4
      - name: Production build
        run: npm run build
      - name: Main process load check (TDZ guard)
        run: node scripts/check-main-load.mjs

  desktop-ui:
    name: Desktop UI smoke (${{ matrix.suite }})
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        suite: [ai-terminal, settings]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run mocked desktop regression
        run: npm run test:ui -- --${{ matrix.suite }}
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/liteconnect-dock-ui-*/*.png
            ${{ runner.temp }}/liteconnect-settings-ui-*/*.png
          if-no-files-found: ignore

  package-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-windows-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Build renderer and main
        run: npm run build
      - name: Package unpacked app (files whitelist smoke)
        run: npx electron-builder --dir
